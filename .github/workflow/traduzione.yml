name: Traduci contenuti

on:
  push:
    paths:
      - 'articoli/**'
      - 'data/**'
      - 'traduci_contenuti.py'
  workflow_dispatch:

jobs:
  traduci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openai

      - name: Run translation script
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python traduci_contenuti.py

      - name: Commit and push translations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add articoli/*_en.txt articoli/*_fr.txt data/*_en.json data/*_fr.json || true
          git commit -m "Traduzioni automatiche" || echo "Nessuna traduzione da aggiungere"
          git push
